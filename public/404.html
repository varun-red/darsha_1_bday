<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost in the woods</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; position: relative; z-index: 2; }
    .lost h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-style: italic; color: var(--gold-bright); margin-bottom: .6rem; }
    .lost .art { font-size: 4rem; animation: floaty 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <main class="lost">
    <div>
      <div class="art">🦉</div>
      <h1>Lost in the woods?</h1>
      <p class="lede">The path you followed doesn't lead anywhere. Let the fireflies guide you back.</p>
      <a class="btn btn--gold" href="/"><span>Back to the party</span></a>
    </div>
  </main>
  <script src="/js/forest.js" defer></script>
</body>
</html>
